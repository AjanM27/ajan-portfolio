<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive RRT* replanning</title>
  <desc id="desc">A moving obstacle blocks the original route. The planner preserves the safe prefix and finds a detour to the goal.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#dbe5d7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="580" rx="16" fill="#f4f6ed"/>
  <text x="36" y="48" fill="#19332e" font-family="Arial,sans-serif" font-size="30" font-weight="700">Adaptive RRT* replanning</text>
  <rect x="36" y="76" width="888" height="416" rx="14" fill="#fbfcf6" stroke="#bdccbd" stroke-width="2"/>
  <rect x="37" y="77" width="886" height="414" rx="13" fill="url(#grid)"/>
  <g fill="#314b49">
    <rect x="167" y="77" width="253" height="135" rx="4"/>
    <rect x="111" y="308" width="82" height="140" rx="4"/>
    <rect x="615" y="310" width="130" height="181" rx="4"/>
    <rect x="803" y="77" width="120" height="92" rx="4"/>
  </g>
  <rect x="465" y="217" width="117" height="90" rx="5" fill="#ffddd1" stroke="#bb492f" stroke-width="3"/>
  <path d="M510 207v-73m-8 10 8-10 8 10" stroke="#bb492f" fill="none" stroke-width="3" stroke-linecap="round"/>
  <text x="529" y="143" fill="#81301e" font-family="Arial,sans-serif" font-size="19" font-weight="700">Moving obstacle</text>
  <path d="M360 267 509 261 650 248 840 234" fill="none" stroke="#7c5b55" stroke-width="5" stroke-dasharray="10 9"/>
  <path d="m360 267 77 58 91 51 65-64 61-46 186-32" fill="none" stroke="#167655" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="m106 164 20 63 62 34 172 6" fill="none" stroke="#216589" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="106" cy="164" r="10" fill="#216589" stroke="#fbfcf6" stroke-width="3"/>
  <circle cx="360" cy="267" r="9" fill="#19332e" stroke="#fbfcf6" stroke-width="3"/>
  <circle cx="840" cy="234" r="10" fill="#167655" stroke="#fbfcf6" stroke-width="3"/>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#19332e">
    <text x="68" y="142">Start</text>
    <text x="241" y="307">Replan from here</text>
    <text x="815" y="211">Goal</text>
    <text x="101" y="546">Retained segment</text>
    <text x="383" y="546">Blocked route</text>
    <text x="653" y="546">New route</text>
  </g>
  <path d="M44 540h44" stroke="#216589" stroke-width="6" stroke-linecap="round"/>
  <path d="M326 540h44" stroke="#7c5b55" stroke-width="5" stroke-dasharray="9 7"/>
  <path d="M596 540h44" stroke="#167655" stroke-width="6" stroke-linecap="round"/>
</svg>
